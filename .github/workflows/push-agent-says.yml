name: Agent Says — Daily Push

on:
  repository_dispatch:
    types: [rusty_agent_says]

jobs:
  push-agent-says:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      contents: read
    steps:
      - name: Fetch open issues
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUES=$(gh api /repos/${{ github.repository }}/issues --jq '[.[:5] | .[] | {title: .title, number: .number}]' 2>/dev/null || echo "[]")
          echo "ISSUES<<EOF" >> $GITHUB_OUTPUT
          echo "$ISSUES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Compose Rusty's message
        id: rusty
        env:
          ISSUES: ${{ steps.context.outputs.ISSUES }}
        run: |
          CONTENT=$(jq -c '
            if length == 0 then
              {message: "The queue is clear. Protect your focus and ship the next concrete thing.", priorities: []}
            else
              {message: "Keep the scope tight: finish the highest-impact open work before starting more.", priorities: [.[0:3][].title]}
            end
          ' <<< "$ISSUES")
          echo "CONTENT<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CONTENT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Push to TRMNL
        env:
          CONTENT: ${{ steps.rusty.outputs.CONTENT }}
          TRMNL_WEBHOOK_URL: ${{ secrets.TRMNL_WEBHOOK_URL }}
        run: |
          MESSAGE=$(echo "$CONTENT" | jq -r '.message')
          P1=$(echo "$CONTENT" | jq -r '.priorities[0] // empty')
          P2=$(echo "$CONTENT" | jq -r '.priorities[1] // empty')
          P3=$(echo "$CONTENT" | jq -r '.priorities[2] // empty')
          DATE=$(date -u '+%b %d, %Y')

          PAYLOAD=$(jq -n \
            --arg msg "$MESSAGE" \
            --arg date "$DATE" \
            --arg p1 "$P1" \
            --arg p2 "$P2" \
            --arg p3 "$P3" \
            '{merge_variables: {
              agent_name: "Rusty",
              message: $msg,
              signature: "— Rusty 🦀",
              date: $date,
              priority_1: $p1,
              priority_2: $p2,
              priority_3: $p3
            }}')

          curl --fail --silent --show-error --output /dev/null -X POST "$TRMNL_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
          echo "TRMNL accepted the update."
