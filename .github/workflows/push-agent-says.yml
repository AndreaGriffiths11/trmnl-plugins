name: Agent Says — Daily Push

on:
  workflow_dispatch:

jobs:
  push-agent-says:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      contents: read
      models: read
    steps:
      - name: Fetch open issues
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUES=$(gh api /repos/${{ github.repository }}/issues --jq '[.[:5] | .[] | {title: .title, number: .number}]' 2>/dev/null || echo "[]")
          echo "ISSUES<<EOF" >> $GITHUB_OUTPUT
          echo "$ISSUES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate message with GitHub Models
        id: copilot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUES: ${{ steps.context.outputs.ISSUES }}
        run: |
          PAYLOAD=$(jq -n \
            --arg issues "$ISSUES" \
            '{
              "messages": [{"role": "user", "content": ("You are a concise, motivational AI assistant. Based on these open issues, write:\n1. A short daily message (1-2 sentences, motivational but practical)\n2. Up to 3 priorities for today\n\nOpen Issues: " + $issues + "\n\nRespond in JSON only: {\"message\": \"...\", \"priorities\": [\"...\", \"...\", \"...\"]}")}],
              "model": "gpt-4o"
            }')

          RESPONSE=$(curl -s https://models.inference.ai.azure.com/chat/completions \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "DEBUG: $RESPONSE"

          CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content' | sed 's/```json//g; s/```//g' | jq -c '.')
          echo "CONTENT<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Push to TRMNL
        env:
          TRMNL_WEBHOOK_URL: ${{ secrets.TRMNL_WEBHOOK_URL }}
        run: |
          CONTENT='${{ steps.copilot.outputs.CONTENT }}'
          MESSAGE=$(echo "$CONTENT" | jq -r '.message')
          P1=$(echo "$CONTENT" | jq -r '.priorities[0] // empty')
          P2=$(echo "$CONTENT" | jq -r '.priorities[1] // empty')
          P3=$(echo "$CONTENT" | jq -r '.priorities[2] // empty')
          DATE=$(date -u '+%b %d, %Y')

          PAYLOAD=$(jq -n \
            --arg msg "$MESSAGE" \
            --arg date "$DATE" \
            --arg p1 "$P1" \
            --arg p2 "$P2" \
            --arg p3 "$P3" \
            '{merge_variables: {
              agent_name: "Copilot",
              message: $msg,
              signature: "— Copilot 🤖",
              date: $date,
              priority_1: $p1,
              priority_2: $p2,
              priority_3: $p3
            }}')

          curl -s -X POST "$TRMNL_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
          echo "Done!"
